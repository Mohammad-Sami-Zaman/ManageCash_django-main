{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block head %}

<title>Add Cash</title>

<style>

    body{
        background: linear-gradient(135deg, #eef2ff, #f8f9fa);
        min-height: 100vh;
    }

    .cash-container{
        max-width: 650px;
        margin: 60px auto;
        padding: 20px;
    }

    .cash-card{
        background: white;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        transition: all 0.4s ease;
    }

    .cash-card:hover{
        transform: translateY(-8px);
        box-shadow: 0 25px 55px rgba(0,0,0,0.18);
    }

    .cash-title{
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        color: #222;
        margin-bottom: 30px;
    }

    form p{
        margin-bottom: 20px;
    }

    form input,
    form textarea,
    form select{
        width: 100%;
        padding: 12px;
        border: 2px solid #e5e5e5;
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    form input:focus,
    form textarea:focus,
    form select:focus{
        outline: none;
        border-color: #0d6efd;
        box-shadow: 0 0 15px rgba(13,110,253,0.25);
    }

    .submit-btn{
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #0d6efd, #6f42c1);
        color: white;
        font-size: 18px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    .submit-btn:hover{
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(13,110,253,0.35);
    }

    .submit-btn:active{
        transform: scale(0.97);
    }

</style>

{% endblock head %}

{% block body %}

<div class="cash-container">


<div class="cash-card">

    <h1 class="cash-title">
        Add Cash
    </h1>

    <form action="" method="POST">

        {% csrf_token %}

        {{ form_data.as_p }}

        <input
            class="submit-btn"
            type="submit"
            value="Add Cash"
        >

    </form>

</div>


</div>

{% endblock body %}
