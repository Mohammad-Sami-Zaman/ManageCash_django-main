{% extends 'master/base.html' %}

{% block head %}

<title>Cash Dashboard</title>

<style>

    body{
        background: linear-gradient(135deg, #f4f7fc, #eef2ff);
        min-height: 100vh;
    }

    .dashboard-container{
        max-width: 1100px;
        margin: 60px auto;
        padding: 20px;
    }

    .dashboard-title{
        text-align: center;
        font-size: 42px;
        font-weight: 700;
        color: #222;
        margin-bottom: 40px;
    }

    .card-container{
        display: flex;
        gap: 25px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .dashboard-card{
        width: 300px;
        padding: 30px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        text-align: center;
        transition: all 0.4s ease;
        cursor: pointer;
    }

    .dashboard-card:hover{
        transform: translateY(-12px) scale(1.03);
        box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    .dashboard-card h3{
        margin-bottom: 15px;
        color: #555;
        font-size: 24px;
    }

    .dashboard-card h1{
        font-size: 42px;
        font-weight: bold;
        margin: 0;
    }

    .income h1{
        color: #28a745;
    }

    .expense h1{
        color: #dc3545;
    }

    .balance h1{
        color: #0d6efd;
    }

    .profile-btn{
        display: block;
        width: fit-content;
        margin: 50px auto;
        padding: 14px 30px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, #0d6efd, #6f42c1);
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px rgba(13,110,253,.25);
    }

    .profile-btn:hover{
        transform: translateY(-5px);
        color: white;
        box-shadow: 0 15px 35px rgba(13,110,253,.4);
    }

    .profile-btn:active{
        transform: scale(0.96);
    }


    @media (max-width:768px){

        .dashboard-card{
            width: 100%;
        }

        .dashboard-title{
            font-size: 32px;
        }

    }

</style>

{% endblock head %}

{% block body %}

<div class="dashboard-container">

```
<h1 class="dashboard-title">
    Cash Management Dashboard
</h1>

<div class="card-container">

    <div class="dashboard-card income">
        <h3>Total Income</h3>
        <h1>{{ income }}</h1>
    </div>

    <div class="dashboard-card expense">
        <h3>Total Expense</h3>
        <h1>{{ expense }}</h1>
    </div>

    <div class="dashboard-card balance">
        <h3>Current Balance</h3>
        <h1>{{ balance }}</h1>
    </div>

</div>

<a class="profile-btn" href="{% url 'profile_view' %}">
    Go To Profile
</a>
```

</div>

{% endblock body %}
