{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block head %}

<title>Login</title>

<style>

    body{
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
    }

    .login-container{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        padding: 20px;
    }

    .login-card{
        width: 100%;
        max-width: 500px;
        background: rgba(255,255,255,0.95);
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        transition: all .4s ease;
    }

    .login-card:hover{
        transform: translateY(-10px);
        box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    }

    .login-title{
        text-align: center;
        font-size: 42px;
        font-weight: 700;
        color: #222;
        margin-bottom: 30px;
    }

    .login-subtitle{
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
    }

    /* Crispy Forms Styling */

    input,
    textarea,
    select{
        border-radius: 12px !important;
        padding: 12px !important;
        transition: all .3s ease !important;
    }

    input:focus,
    textarea:focus,
    select:focus{
        box-shadow: 0 0 15px rgba(102,126,234,.3) !important;
        border-color: #667eea !important;
    }

    /* Login Button */

    .login-btn{
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 18px;
        font-weight: 600;
        margin-top: 15px;
        transition: all .3s ease;
        cursor: pointer;
    }

    .login-btn:hover{
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(102,126,234,.4);
    }

    .login-btn:active{
        transform: scale(0.97);
    }

</style>

{% endblock head %}

{% block body %}

<div class="login-container">

```
<div class="login-card">

    <h1 class="login-title">
        Welcome Back
    </h1>

    <p class="login-subtitle">
        Login to your Cash Management Account
    </p>

    <form action="" method="POST">

        {% csrf_token %}

        {{ form_data|crispy }}

        <input
            class="login-btn"
            type="submit"
            value="Login"
        >

    </form>

</div>
```

</div>

{% endblock body %}
