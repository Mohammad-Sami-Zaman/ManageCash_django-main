{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block head %}

<title>Sign Up</title>

<style>

    body{
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        min-height: 100vh;
    }

    .signup-container{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        padding: 20px;
    }

    .signup-card{
        width: 100%;
        max-width: 600px;
        background: rgba(255,255,255,0.95);
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        transition: all .4s ease;
    }

    .signup-card:hover{
        transform: translateY(-10px);
        box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    }

    .signup-title{
        text-align: center;
        font-size: 42px;
        font-weight: 700;
        color: #222;
        margin-bottom: 20px;
    }

    .signup-subtitle{
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
    }

    /* Crispy Forms Styling */

    input,
    textarea,
    select{
        border-radius: 12px !important;
        padding: 12px !important;
        transition: all .3s ease !important;
    }

    input:focus,
    textarea:focus,
    select:focus{
        box-shadow: 0 0 15px rgba(79,172,254,.3) !important;
        border-color: #4facfe !important;
    }

    /* Sign Up Button */

    .signup-btn{
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #4facfe, #00c6ff);
        color: white;
        font-size: 18px;
        font-weight: 600;
        margin-top: 15px;
        transition: all .3s ease;
        cursor: pointer;
    }

    .signup-btn:hover{
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(79,172,254,.4);
    }

    .signup-btn:active{
        transform: scale(0.97);
    }

</style>

{% endblock head %}

{% block body %}

<div class="signup-container">

```
<div class="signup-card">

    <h1 class="signup-title">
        Create Your Account
    </h1>

    <p class="signup-subtitle">
        Join the Cash Management System today.
    </p>

    <form action="" method="POST">

        {% csrf_token %}

        {{ form_data|crispy }}

        <input
            class="signup-btn"
            type="submit"
            value="Sign Up"
        >

    </form>

</div>
```

</div>

{% endblock body %}
