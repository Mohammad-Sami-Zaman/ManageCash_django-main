{% block head %}
<style>

    /* Navbar */

    .custom-navbar{
        background: linear-gradient(135deg, #0d6efd, #6f42c1);
        padding: 15px 30px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Align Items */

    .navbar-nav{
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
    }

    /* Navigation Buttons */

    .navbar-nav .nav-link{
        color: white !important;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 12px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    /* Hover Effect */

    .navbar-nav .nav-link:hover{
        background-color: rgba(255,255,255,0.2);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Click Effect */

    .navbar-nav .nav-link:active{
        transform: scale(0.95);
    }

    /* Fancy Underline Animation */

    .navbar-nav .nav-link::after{
        content: "";
        position: absolute;
        left: 50%;
        bottom: 5px;
        width: 0;
        height: 2px;
        background: white;
        transition: 0.3s;
        transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after{
        width: 70%;
    }

    /* Responsive */

    @media (max-width:768px){

        .navbar-nav{
            flex-direction: column;
            align-items: flex-start;
        }

        .navbar-nav .nav-link{
            width: 100%;
        }

    }

</style>
{% endblock head %}



<nav class="navbar navbar-expand-lg custom-navbar">

    <div class="container-fluid">

        <div class="collapse navbar-collapse show">

            <div class="navbar-nav">

                {% if request.user.is_authenticated %}

                <a class="nav-link" href="{% url 'profile_view' %}">
                    Profile
                </a>

                <a class="nav-link" href="{% url 'Transaction' %}">
                    Transactions
                </a>

                <a class="nav-link" href="{% url 'cash_dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link" href="{% url 'expense' %}">
                    Expense
                </a>

                <a class="nav-link" href="{% url 'AddCash' %}">
                    Add Cash
                </a>

                <a class="nav-link" href="{% url 'logout_view' %}">
                    Logout
                </a>

                {% else %}

                <a class="nav-link" href="{% url 'login' %}">
                    Login
                </a>

                <a class="nav-link" href="{% url 'signup' %}">
                    Sign Up
                </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
